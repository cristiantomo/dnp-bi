[theme]
base = "light"
primaryColor = "#0F5C56"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7f6"
textColor = "#1F2328"
borderColor = "#d8e0de"
linkColor = "#0F5C56"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
baseFontSize = 15
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600;700&display=swap"
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#0F5C56", "#B45309", "#9F1239", "#1D4ED8", "#4D7C0F"]
chartSequentialColors = ["#f0fdfa", "#ccfbf1", "#99f6e4", "#5eead4", "#2dd4bf", "#14b8a6", "#0d9488", "#0f766e", "#115e59", "#134e4a"]

[theme.sidebar]
backgroundColor = "#f4f7f6"
secondaryBackgroundColor = "#ffffff"
borderColor = "#d8e0de"

